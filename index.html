.hero .btns{display:flex;gap:10px;justify-content:center}.hero .btn{height:46px;padding:0 22px;margin:0;line-height:1;white-space:nowrap}.hero .btn.a{padding:0 24px}

 background:linear-gradient(105deg,#8b6a2a 0%,#f3dc92 16%,#b98a30 32%,#fff4c8 50%,#c79a3c 66%,#f1d98f 84%,#8b6a2a 100%);background-size:200% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 -1px 0 rgba(255,244,200,.55)) drop-shadow(0 1px 0 #2e1f06) drop-shadow(0 3px 4px rgba(0,0,0,.75));animation:gold 7s linear infinite}

;line-height:1.1;text-align:center;margin:0 0 36px}\n.next p{font-size:19px;line-height:1.75;margin:0 0 1.15em}\n.w{display:inline-block;opacity:0;animation:ink 1.3s ease forwards}\n.w.it{font-style:italic}\n@keyframes ink{0%{opacity:0;filter:blur(7px);transform:translateY(5px);text-shadow:0 0 14px var(--gold)}\n 55%{opacity:1;text-shadow:0 0 12px var(--gold)}100%{opacity:1;filter:blur(0);transform:none;text-shadow:0 0 0 transparent}}\n.choices.locked .choice{pointer-events:none}\n.choices.locked .choice:not(.sel){opacity:.3;transition:opacity .8s}\n.again{display:block;margin:30px auto 0;background:none;border:0;font:italic 17px 'EB Garamond',Georgia,serif;color:var(--muted);cursor:pointer;opacity:0;animation:ink 1.3s ease forwards}\n@media (prefers-reduced-motion:reduce){.w{animation-duration:.01s;animation-delay:0s!important}}\n.next+.next{margin-top:14px}.next .chapter{margin-bottom:0}.next .choices{margin-top:30px}.choices.w{display:block}\n.next .end{margin-top:34px;text-align:center;color:var(--muted);letter-spacing:.3em;font-size:15px}\n.sk *{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sk .f{fill:var(--ink)}.sk .p{fill:var(--paper)}\n.ill{margin:0 0 28px}.ill.w{display:block}.ill svg{width:100%;height:auto;display:block}\n.sk .t{stroke-width:.8}.sk .hx{fill:url(#h1)}.sk .hy{fill:url(#h2)}.sk .l{stroke:var(--paper);stroke-width:1}\n<\/style>\n<\/head>\n<body>\n<svg class=\"sk\" width=\"0\" height=\"0\" style=\"position:absolute\"><defs>\n<filter id=\"pc\"><feTurbulence type=\"fractalNoise\" baseFrequency=\".04\" numOctaves=\"3\" seed=\"5\"/><feDisplacementMap in=\"SourceGraphic\" scale=\"3\"/><\/filter>\n<pattern id=\"h1\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(40)\"><path d=\"M0 0V4\" style=\"stroke-width:.8\"/><\/pattern>\n<pattern id=\"h2\" width=\"3\" height=\"3\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(-35)\"><path d=\"M0 0V3\" style=\"stroke-width: ss=\"t\" d=\"M8-92l16-14\"/><path d=\"M-14-46L46-66M-14-44L46-64\"/><path class=\"f\" d=\"M-18-48l8 6-4 8-8-4z\"/><\/g>\n<g id=\"moon\"><circle r=\"34\" class=\"t\" style=\"opacity:.5\"/><circle r=\"44\" class=\"t\" style=\"opacity:.3\"/><circle class=\"p\" r=\"26\"/><path class=\"f\" d=\"M8-20A22 22 0 1 0 8 20 16 16 0 1 1 8-20Z\"/><\/g>\n<g id=\"bed\"><path class=\"p\" d=\"M-62-34H62V-8H-62Z\"/><path class=\"hx\" d=\"M-60-34H60L56-14H-56Z\"/><path class=\"p\" d=\"M-45-30h12v10h-12zM15-30h12v10H15z\"/><path class=\"p\" d=\"M-58-34q4-14 24-12 14 0 20 6z\"/><path class=\"p\" d=\"M-64-62H-56V0H-64ZM60-48H68V0H60Z\"/><circle class=\"p\" cx=\"-60\" cy=\"-65\" r=\"4\"/><circle class=\"p\" cx=\"64\" cy=\"-51\" r=\"4\"/><\/g>\n<g id=\"tbl\"><path class=\"p\" d=\"M-64-42H64V-36H-64Z\"/><path class=\"hx\" d=\"M-60-36H60L66-10H-66Z\"/><path d=\"M-52-10V0M52-10V0\"/><path class=\"p\" d=\"M-8-42q-14 0-12-14 2-10 14-10h10q12 0 12 10 0 14-14 14z\"/><path d=\"M12-60q10 0 8 8\"/><path class=\"p\" d=\"M-44-42l2-10h12l2 10zM30-42l2-10h12l2 10z\"/><path class=\"p\" d=\"M50-42v-18h5v18z\"/><path class=\"f\" d=\"M52.5-72q-5 6 0 10 5-4 0-10z\"/><\/g>\n<path id=\"hood\" class=\"f\" d=\"M-14 0Q-12-26 0-28 12-26 14 0Z\"/>\n<g id=\"flw\"><path d=\"M0 0V-26M10 0V-18M-10 0V-20\"/><path class=\"t\" d=\"M0-10q-8-4-10 2M10-6q8-2 10 3\"/><circle class=\"p\" cx=\"0\" cy=\"-30\" r=\"5\"/><circle class=\"p\" cx=\"10\" cy=\"-22\" r=\"4\"/><circle class=\"p\" cx=\"-10\" cy=\"-24\" r=\"4\"/><path class=\"t\" d=\"M0-36v-4M-5-33l-3-3M5-33l3-3\"/><\/g>\n<g id=\"sgn\"><path d=\"M0 0V-70\"/><path class=\"p\" d=\"M0-64H34L42-58 34-52H0ZM0-46H-34L-42-40-34-34H0Z\"/><path class=\"t\" d=\"M6-58h22M-6-40h-22\"/><\/g>\n<\/defs><\/svg>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\"><filter id=\"rough\"><feTurbulence type=\"fractalNoise\" baseFrequency=\".04 .08\" numOctaves=\"3\" seed=\"4\" result=\"t\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"t\" scale=\"9\"/><\/filter><\/svg>\n<main class=\"page\">\n  <div class=\"chapter\">Bölüm I<\/div>\n  <div class=\"rule\"><\/div>\n  <h1>Kırmızı Başlıklı Kız<\/h1>\n  \n  <div class=\"text\">\n    <p>Ormanın kıyısındaki küçük evde sabah erken başlamıştı. Annesi sepete sıcak ekmek, bal ve bir kavanoz reçel koyarken kırmızı pelerinli kızına döndü.<\/p>\n    <p><em>“Büyükannen hasta, kızım. Bunları ona götürmen gerek. Yoldan sakın ayrılma.”<\/em><\/p>\n  <\/div>\n  <div class=\"div\"><i><\/i><\/div>\n  <div class=\"text\">\n    <p>Kız pencereden baktı; bahçede arkadaşları top oynuyordu.<br>Sepet masada, kapı aralıktı.<\/p>\n  <\/div>\n  <div class=\"choices\" id=\"choices\">\n    <button class=\"choice\">Tamam anne, hemen götürürüm. <span>→<\/span><\/button>\n    <button class=\"choice\">Anne, arkadaşlarımla oynuyorum; sen götür. <span>→<\/span><\/button>\n  <\/div>\n  <div class=\"folio\">1<\/div>\n<\/main>\n<section class=\"next\" id=\"next\" aria-live=\"polite\"><span class=\"hint\">2<\/span><\/section>\n<script>\nconst S={\"n2a\": {\"t\": \"Ormanın Kapısı\", \"p\": [\"Kız sepeti koluna astı, kırmızı başlığını çekti ve patikaya girdi. Ağaçlar yüksekti, yaprakların arasından süzülen ışık yolu benekli bir kumaş gibi örtüyordu. Uzaklardan ritmik bir balta sesi geliyordu: orman avcısı sabahın erken saatinde işe koyulmuştu.\", \"Birden yol kenarındaki eğrelti otları kıpırdadı. İri, tüylü bir kurt patikaya çıktı ve başını nazikçe eğdi. *“Günaydın, küçük hanım! Bu güzel sepet böyle erkenden nereye gidiyor?”*\", \"Kızın aklına annesinin sözü geldi: *yoldan ayrılma.* Ama kurdun sesi o kadar yumuşak, gözleri o kadar ilgiliydi ki cevap vermemek kabalık gibi göründü.\"], \"c\": [[\"Büyükannemin kulübesine, derenin ötesine.\", \"n3a1\"], [\"Yabancılarla konuşmam, deyip yürürüm.\", \"n3a2\"]]}, \"n3a1\": {\"t\": \"Kısa Yol\", \"p\": [\"Kurt gözlerini parlattı. *“Büyükannen çiçeği sever mi? Şurada, çayırda en güzelleri açmış.”* Kız, bir buket yapmak için patikadan ayrıldı. O sırada kurt sessizce koşup kulübeye ondan önce vardı.\", \"Kız kapıyı ittiğinde içerisi loştu. Büyükannesi yatakta, yorganı burnuna kadar çekmiş yatıyordu. Ama bonesi eğriydi, sesi boğuktu ve gölgesi yatağa hiç sığmıyordu.\", \"*“Yaklaş, kızım,”* dedi yataktaki. Kızın içinde küçük bir çan çalmaya başladı.\"], \"c\": [[\"“Büyükanne, ağzın neden bu kadar büyük?”\", \"e1\"], [\"Yatağın altına eğilip bakarım.\", \"e2\"]]}, \"n3a2\": {\"t\": \"Sessiz Adımlar\", \"p\": [\"Kız cevap vermedi, adımlarını hızlandırdı. Arkasında yaprak hışırtısı vardı: kurt, belli bir mesafeden onu izliyordu. Kız her dönüşünde onu biraz daha yakında buldu.\", \"Kulübeye vardığında büyükannesi kapıyı açtı; yanakları solgun ama gözleri neşeliydi. Pencerede iri bir gölge belirdi ve burnunu cama dayadı. Büyükanne fısıldadı: *“O her gün gelir. Ama bugün bir tuhaflık var.”*\", \"Uzaktan, ağaçların arasından avcının balta sesleri yaklaşıyordu.\"], \"c\": [[\"Kurdu içeri davet ederim.\", \"e3\"], [\"Kapıyı kilitleyip avcıyı çağırırım.\", \"e4\"]]}, \"e1\": {\"t\": \"Büyük Ağız\", \"p\": [\"*“Seni daha iyi yemek için, kızım!”* Kurt yataktan fırladı ve bir lokmada kızı yuttu. Sonra, büyükanneyi çoktan yuttuğu için, karnı tok, yatağa uzandı ve horlamaya başladı.\", \"O sırada kulübenin önünden geçen avcı, o gürültüyü duydu. *“Yaşlı kadın böyle horlamaz.”* İçeri girdi, bir bakışta durumu anladı ve makasını çıkardı. Kurdun karnını açtığında kırmızı bir başlık göründü.\", \"Büyükanne ve kız, nefes nefese dışarı çıktı. Kurdun karnını taşlarla doldurdular. Kurt uyandığında kaçmaya çalıştı ama taşların ağırlığıyla yere yığıldı. O günden sonra kız, annesinin sözünden bir daha ayrılmadı.\"]}, \"e2\": {\"t\": \"Yatağın Altındaki Gerçek\", \"p\": [\"Kız yere çömelip yatağın altına baktı. Orada büyükanne yoktu; üst üste yığılmış onlarca kırmızı başlık vardı: küçük, soluk, yıllanmış. Başlıkların hepsi kız çocuklarına aitti.\", \"Yataktaki figür yavaşça doğruldu. *“Gerçek büyükannen yıllar önce gitti, tatlım. Ben ise çok aç bir yalnızlığım.”* Kız çığlık atarak dışarı fırladı.\", \"Kapıda avcı duruyordu. Yıllardır bu kulübenin gizemini çözmeye çalışıyordu. Silahını doğrulttu ama ateş etmedi: kulübe boştu. Geriye yalnızca eski bir yatak, bir yığın başlık ve kapı eşiğinde kızın düşürdüğü sepet kaldı.\"]}, \"e3\": {\"t\": \"Üç Kişilik Çay\", \"p\": [\"Kız kapıyı açıp kurdu içeri aldı. Kurt tedirgin bir şekilde eşikte durdu, pelerinin kırmızısına bakıp utandı. Aslında günlerdir aç ve yalnızdı; yolunu kaybetmiş bir ormanlıydı.\", \"Büyükanne ona sıcak çorba verdi, kız sepetten reçeli çıkarıp ekmeğe sürdü. Kurt, hiç kimsenin ona çorba vermediğini söyledi ve gözlerini kırptı. Hasta olan büyükanne o akşam ilk kez gülümsedi.\", \"Avcı kapıyı çaldığında kurt masanın altına saklandı. Avcı gördü, bir an durdu, sonra şapkasını çıkardı: *“Ben de bir fincan çay alırdım.”*\"]}, \"e4\": {\"t\": \"Avcının Gerçek Yüzü\", \"p\": [\"Kız kapıyı kilitleyip avcıyı çağırdı. Avcı geldi, ama yüzü endişe değil, memnuniyet doluydu. Kapıdan içeri girerken, kurdun pencerede takılan postuna gözünü dikti. *“Üç yıldır bu postun peşindeyim. Bu kulübeyi senin büyükannene verdiğimi unutma.”*\", \"Büyükanne gözlerini kıstı. Avcı aslında kulübenin toprağını istiyordu ve kurt, büyükannenin tek koruyucusuydu. Her şey birden netleşti: kapıyı kilitlemek, yanlış tarafı çağırmak demekti.\", \"Kız pencereyi hızla açtı, kurt fırlayıp ormana kaçtı. Avcı kızdı, bağırdı, ama kızın kırmızı pelerini artık bir bayrak gibi, onun karşısında dimdik duruyordu.\"]}, \"n2b\": {\"t\": \"Annenin Sepeti\", \"p\": [\"Annesi bir an şaşırdı ama gülümsedi. *“Peki, ben giderim. Akşam yemeğinde görüşürüz.”* Sepeti aldı, kapıyı kapadı. Pencereden avcının atıyla ormana doğru geçtiğini gördü kız, sonra bahçeye koşup oyuna daldı.\", \"Saatler su gibi aktı. Güneş çatıya doğru eğilirken kız ilk kez rahatsız oldu. Annesi dönmemişti. Masanın üzerinde, büyükannenin ilaç şişesi duruyordu; annesi onu unutmuştu.\", \"Dışarıda rüzgâr yükseldi, ağaçlar ürpertiyle sallandı.\"], \"c\": [[\"İlacı alıp annemin ardından koşarım.\", \"n3b1\"], [\"Evde beklerim, annem dönecektir.\", \"n3b2\"]]}, \"n3b1\": {\"t\": \"Geciken İlaç\", \"p\": [\"Pelerinini savurarak ormana daldı. Patikanın çatalında iri bir kurt belirdi: *“Acelen var gibi. Kısa yolu biliyorum, seni bir çırpıda ulaştırırım.”*\", \"Gün son ışığını topluyordu. Kurdun gözleri tuhaf biçimde güven vericiydi. Ama kızın içinde bir yerden uyarıcı bir ses geliyordu: *ne zaman bir yabancı seni yoldan çevirir, o yol senin değildir.*\", \"Uzaklardan avcının borusu duyuldu, soluk ve yalnız.\"], \"c\": [[\"Kurda güvenir, kısa yoldan giderim.\", \"e5\"], [\"Patikadan giderim; kurda güvenmem.\", \"e6\"]]}, \"n3b2\": {\"t\": \"Pencerenin Ardı\", \"p\": [\"Kız masanın başında bekledi. Ocağın sesi kısıldı, saat on ikiyi vurdu. Sonra kapı üç kez tıklandı. Pencereden bakınca kapıda kocaman bir kurt gördü; kolunda annesinin sepeti asılıydı ve sepet boştu.\", \"Kurdun gözleri endişeliydi. Ağzında katlanmış bir kâğıt tutuyordu. Arkasında, ağaçların arasında hareket eden bir gölge daha vardı: avcı, tüfeğini kurda doğrultmuş, yaklaşıyordu.\"], \"c\": [[\"Kapıyı açarım.\", \"e7\"], [\"Pencereden seslenirim, kapıyı açmam.\", \"e8\"]]}, \"e5\": {\"t\": \"Kurdun Karnında\", \"p\": [\"Kısa yol, gerçekten kısaydı: kulübeye çabucak vardılar. Ama kulübe karanlıktı, kapı aralıktı. İçeride büyükanneden hiçbir iz yoktu; yalnızca örgü şişleri yerde saçılmıştı.\", \"Kurt dönüp gülümsedi, dişleri kırmızı ışıkta parladı. *“Aslında ilaca ihtiyacım vardı, kızım. Açlığa.”* Kızın çığlığı ormanın içinde kayboldu.\", \"Ertesi sabah avcı kulübeye geldiğinde kapı ardına kadar açıktı. Yatağın üzerinde yalnızca bir şey duruyordu: kırmızı bir başlık, kusursuzca katlanmış.\"]}, \"e6\": {\"t\": \"Avcıyla Büyükanne\", \"p\": [\"Patikada yürürken karşısına avcı çıktı. *“Annen kulübede, ayağını burkmuş. Seni arıyordum.”* İlaçla birlikte hızla kulübeye vardılar. Büyükanne kapıda onları karşıladı, yanında annesi oturuyordu.\", \"Kız, avcının büyükanneye yürek çarpıntısıyla baktığını fark etti. Büyükanne ise kulağına eğilip fısıldadı: *“Bu adamla kırk yıl önce evlenecektik ama babam izin vermedi.”*\", \"O kış, kulübede küçük bir düğün oldu. Kurt ise uzaktan baktı, mutluydu: ona da bir kemik bırakıldı.\"]}, \"e7\": {\"t\": \"Büyük Ev\", \"p\": [\"Kızın elleri titreyerek kapıyı açtı. Kurt, sırtında yaralı annesiyle içeri girdi. Annesi ormanda ayağını burkmuş, kurt onu taşımıştı. Kâğıtta yazan tek cümle: *“Yardım getirdim.”*\", \"Avcı kapıdan girdiğinde silahı indirdi, bir süre hiçbir şey söylemedi. Sonra şapkasını çıkarıp kurdun başını okşadı. Birlikte büyükanneyi de getirdiler, ve küçük ev o kış herkesin evi oldu.\", \"Kız, o geceden sonra ormandan korkmaktan vazgeçti; çünkü korkmasının nedeni orman değil, bilmediği şeylerdi.\"]}, \"e8\": {\"t\": \"Yanlış Anlaşılan Kurt\", \"p\": [\"Kız pencereden *“Git buradan!”* diye bağırdı. Kurt kâğıdı kapının altından uzattı, ama kız okumadan çanı çalmaya koştu. Avcı, çan sesini duyunca hızla yaklaştı.\", \"Tek bir el silah sesi ormanın sessizliğini yırttı. Kurt, kâğıdı ağzında, yere yığıldı. Kız kâğıdı açtığında annesinin yazısını tanıdı: *“Ayağımı burktum. Kurt bana yardım ediyor. Korkma.”*\", \"Avcı silahını yavaşça indirdi. Annesi, kurdun bulduğu patikadan eve ulaştığında kız yalnızca tek bir şey söyleyebildi: *“Okumadım.”* Köy, o yıl kurdun anısına bir kurt çanı astı.\"]}},R=['I','II','III','IV','V'];\nconst box=document.getElementById('choices'),first=document.getElementById('next');\nfunction words(el,text,d){let it=false;text.split(' ').forEach(w=>{\n  if(w.startsWith('*')){it=true;w=w.slice(1)}const end=w.endsWith('*');if(end)w=w.slice(0,-1);\n  const sp=document.createElement('span');sp.className='w'+(it?' it':'');sp.textContent=w;sp.style.animationDelay=d+'s';\n  el.append(sp,' ');d+=.07+Math.min(w.length,9)*.01;if(end)it=false});return d}\nfunction add(pg,tag,cls,d){const x=document.createElement(tag);x.className=cls;x.style.animationDelay=d+'s';pg.append(x);return x}\nfunction bind(bx,ids,pg,depth){const bs=[...bx.querySelectorAll('.choice')];bs.forEach((b,i)=>b.onclick=()=>{A();\n  b.classList.add('sel');bx.classList.add('locked');\n  setTimeout(()=>{let t=pg;if(depth>1){t=document.createElement('section');t.className='next';pg.after(t)}\n    show(ids[i],depth+1,t);t.scrollIntoView({behavior:'smooth',block:'start'})},500)})}\nlet ctx;\nfunction A(){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}return ctx}\nfunction tone(f,t,d,type,g,to){const c=ctx,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);\n v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g,t+Math.min(.04,d/4));v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.05)}\nfunction pad(f,t,d,g){const c=ctx,o=c.createOscillator(),v=c.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime(g,t+d*.5);v.gain.linearRampToValueAtTime(0.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.05)}\nfunction bookOpen(){try{if(!A())return;const t=ctx.currentTime+.05;tone(90,t,.35,'sine',.35,45);[110,164.8,220,277.2].forEach(f=>pad(f,t+.2,2.6,.08));tone(1568,t+1.3,1.4,'sine',.07)}catch(e){}}\nconst U=(i,x,y=220,s=1,f=1,r=0)=>`<use href=\"#${i}\" transform=\"translate(${x} ${y}) rotate(${r}) scale(${s*f} ${s})\"/>`;\nconst GR=(()=>{let p='M0 222H600';for(let i=0;i<46;i++){p+=`M${i*13+(i*37%9)} ${226+i%3*6}l-7 8`}return p})();\nconst E=(d,c='')=>`<path class=\"${c}\" d=\"${d}\"/>`;\nconst SC={\nn1:U('cab',150)+U('mom',215)+U('girl',262)+U('bush',340)+U('tree',520)+'<circle class=\"p\" cx=\"420\" cy=\"212\" r=\"9\"/>',\nn2a:U('tree',70,225,1.3)+U('tree',150,222,.8)+U('tree',540,225,1.3)+U('tree',470,222,.8)+E('M230 260Q300 235 330 205M390 260Q350 235 335 205')+U('girl',300,250,.9)+U('wolf',430,222,1,-1)+U('hun',110,205,.5),\nn3a1:U('flw',70)+U('flw',110,224)+U('girl',160)+U('wolf',360,222,1)+E('M250 190h-30M255 170h-40M250 150h-24')+U('cab',520),\nn3a2:U('wolf',70,222,.8)+U('girl',230)+U('cab',470)+U('mom',470,222,.95)+U('tree',360,222,.7)+E('M150 150h-26M155 175h-34'),\ne1:U('bed',210,220,1.5)+U('wolf',200,200,1.2)+E('M230 120Q285 85 300 135L270 160Z','p')+U('girl',430)+E('M520 220V90H590V220','')+U('hun',555,220,1.3),\ne2:U('bed',320,200,1.7)+U('hood',270,224,.8)+U('hood',300,224,.9)+U('hood',335,224,.7)+U('girl',150,224,1,1)+E('M290 105Q320 40 350 105Z','f')+'<circle class=\"f\" cx=\"320\" cy=\"85\" r=\"14\"/>'+U('hun',530,220,1.1),\ne3:U('wolf',160,222,.9)+U('tbl',300,220,1.2)+U('girl',410)+U('mom',470)+U('hun',560,222,.9),\ne4:U('cab',130,220,1.2)+U('hun',400,220,1.6,-1)+U('girl',250)+U('wolf',545,222,.9)+E('M345 100l-90 24M345 105l-70 50'),\nn2b:U('cab',120)+U('girl',60,222,.8)+U('mom',320,222,.95)+U('tree',470,225,1.1)+U('tree',555,222,.8)+U('hun',390,205,.6)+'<circle class=\"p\" cx=\"210\" cy=\"212\" r=\"9\"/>',\nn3b1:U('sgn',300)+E('M300 222Q230 240 100 262M300 222Q380 240 520 262')+U('girl',150,225,1.1)+U('wolf',440,222,1.1,-1)+U('moon',500,60,1.2)+U('tree',570,225,1)+E('M60 190h-30M70 170h-36'),\nn3b2:E('M360 30H570V175H360ZM465 30V175M360 100H570','p')+U('wolf',415,172,.7)+U('hun',525,172,.7)+U('girl',160)+U('tbl',80,220,.9)+U('moon',60,50,.7),\ne5:U('cab',300,220,1.6)+E('M278 220V150H322V220Z','f')+'<circle class=\"p\" cx=\"291\" cy=\"188\" r=\"3\"/><circle class=\"p\" cx=\"309\" cy=\"188\" r=\"3\"/>'+U('hood',300,226,1)+U('moon',90,60,1.2)+U('tree',60,225,1)+U('tree',545,225,1.2),\ne6:E('M200 220V110Q300 40 400 110V220')+E('M215 150q10-10 20 0M245 100q10-10 20 0M335 100q10-10 20 0M365 150q10-10 20 0M205 190q10-10 20 0M375 190q10-10 20 0','p')+U('hun',270)+U('mom',330)+E('M280 185H320')+U('girl',160)+U('mom',460)+U('wolf',545,222,.6),\ne7:U('cab',480)+U('wolf',230,222,1.2)+`<use href=\"#mom\" transform=\"translate(225 142) rotate(75) scale(.95)\"/>`+U('girl',4
